[project]
name = "pyxledger"
version = "0.1.0"
description = "A simple Python template project"
authors = [{ name = "David Skoland", email = "david.skoland@intrix.no" }]
requires-python = "==3.11.*"

dependencies = [
    "certifi==2025.4.26",
    "charset-normalizer==3.4.2",
    "idna==3.10",
    "iniconfig==2.1.0",
    "packaging==25.0",
    "pip-review==1.3.0",
    "pluggy==1.6.0",
    "pytest==8.3.5",
    "python-dotenv==1.1.0",
    "requests==2.32.3",
    "urllib3==2.4.0"
]

[project.optional-dependencies]
dev = [
    "setuptools",
    "wheel",
    "ruff",
    "tox",
    "tox-uv"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
lint.select = ["E", "F"]
exclude = ["build", "dist", "venv"]
